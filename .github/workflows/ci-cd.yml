# Intégration et livraison continues de l'API de scoring churn.
# - À chaque push / pull request : tests, construction de l'image Docker, test de démarrage.
# - Sur une étiquette vX.Y.Z : publication de l'image sur GitHub Container Registry, puis déploiement
#   en production après approbation manuelle (environnement GitHub « production »).
name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (scoring + API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Installer les dépendances (versions figées de l'entraînement)
        run: pip install -r api/requirements.txt pytest httpx
      - name: Lancer les tests
        run: pytest -q

  image:
    name: Image Docker + test de démarrage
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image
        run: docker build -t churn-api:ci .
      - name: Démarrer le conteneur et vérifier /health et /ready
        run: |
          docker run -d --name churn-api -p 8000:8000 -e CHURN_API_KEY=ci churn-api:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/ready && break || sleep 1; done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/ready
          test "$(docker inspect churn-api --format '{{.Config.User}}')" = "appuser"
      - name: Journaux du conteneur en cas d'échec
        if: failure()
        run: docker logs churn-api

  publication:
    name: Publication de l'image (étiquette vX.Y.Z)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier que l'étiquette correspond à la version du modèle embarqué
        run: |
          grep -q "CHURN_MODEL_VERSION=${GITHUB_REF_NAME#v}" Dockerfile \
            || { echo "L'étiquette $GITHUB_REF_NAME ne correspond pas à CHURN_MODEL_VERSION du Dockerfile"; exit 1; }
      - id: meta
        name: Nom de l'image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construire et publier
        run: |
          docker build -t "${{ steps.meta.outputs.image }}:${GITHUB_REF_NAME#v}" -t "${{ steps.meta.outputs.image }}:latest" .
          docker push "${{ steps.meta.outputs.image }}:${GITHUB_REF_NAME#v}"
          docker push "${{ steps.meta.outputs.image }}:latest"

  deploiement:
    name: Déploiement en production (approbation manuelle)
    needs: publication
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Déployer l'image publiée
        # La plateforme cible n'est pas imposée par le projet : cette étape est à remplacer par la commande
        # de l'hébergeur (kubectl set image, az containerapp update, gcloud run deploy…).
        # L'approbation manuelle se configure dans Settings > Environments > production > Required reviewers.
        run: echo "Déploiement de ${{ needs.publication.outputs.image }}:${GITHUB_REF_NAME#v}"
